name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, build, and smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke:routes
      - run: npm run smoke:api-errors
      - run: git diff --check
